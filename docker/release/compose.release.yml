name: notas-universitarias-release

x-api-image: &api-image
  build:
    context: ../..
    dockerfile: docker/apps/api.Dockerfile
  image: notas-universitarias-api:release

services:
  mongodb:
    image: mongo:8
    container_name: mongodb-release
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb-data-release:/data/db
      - ../db/init-code:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --host localhost --port 27017 -u admin -p password --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")' --quiet"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *api-image
    command: ["pnpm", "--filter=@notas-universitarias/api", "migrate"]
    environment:
      IS_PROD: "true"
      DB_URI_PROD: mongodb://app-user:password@mongodb:27017/app
      SESSION_COOKIE_NAME: user_session
      CORS_ALLOWED_ORIGINS: http://localhost:3987
      SESSION_COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: none
      TEMP_USER_COOKIE_NAME: temp-user
    depends_on:
      mongodb:
        condition: service_healthy

  api:
    <<: *api-image
    command: ["pnpm", "--filter=@notas-universitarias/api", "start"]
    ports:
      - "3035:3035"
    environment:
      IS_PROD: "true"
      DB_URI_PROD: mongodb://app-user:password@mongodb:27017/app
      SESSION_COOKIE_NAME: user_session
      CORS_ALLOWED_ORIGINS: http://localhost:3987
      SESSION_COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: none
      TEMP_USER_COOKIE_NAME: temp-user
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: docker/apps/web.Dockerfile
      args:
        VITE_API_URL: http://localhost:3035/api/v1
        VITE_INTERNAL_API_URL: http://api:3035/api/v1
    image: notas-universitarias-web:release
    ports:
      - "3987:3987"
    environment:
      PORT: "3987"
      HOST: "0.0.0.0"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  mongodb-data-release:
    name: notas-universitarias-mongodb-release